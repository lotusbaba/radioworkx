name: radioworkx
x-app: &app
  build: .
  environment: &env
    DATA_DIR: ${RADIO_DATA_DIR:-/data}
    REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
    QUEUE_PREFIX: ${QUEUE_PREFIX:-radio}
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SESSION_SECRET: ${SESSION_SECRET:-local-development-change-me}
    COOKIE_SECURE: ${COOKIE_SECURE:-0}
    REACTION_THRESHOLD: ${REACTION_THRESHOLD:-20}
    DOWNLOAD_HOSTS: ${DOWNLOAD_HOSTS:-}
    DEMO_MODE: ${DEMO_MODE:-0}
    TELEMETRY_ENABLED: "1"
    TELEMETRY_DIR: /telemetry
    ELASTICSEARCH_URL: http://elasticsearch:9200
    VIDEOS_ENABLED: ${VIDEOS_ENABLED:-1}
    MEDIA_BUCKET: ${MEDIA_BUCKET:-radioworkx-media}
    CRAWLER_ENABLED: ${CRAWLER_ENABLED:-1}
    CRAWLER_PAGE_BUDGET: ${CRAWLER_PAGE_BUDGET:-20}
  volumes:
    - radio-data:/data
    - telemetry-data:/telemetry
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    localstack:
      condition: service_healthy
services:
  localstack:
    build:
      context: .
      dockerfile: infra/Dockerfile.localstack
    environment:
      SERVICES: sqs,s3
    volumes: ["localstack-data:/var/lib/localstack"]
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *app
    image: ${RADIO_API_IMAGE:-radioworkx-api:local}
    environment: &api-env
      <<: *env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_CHAT_DAILY_LIMIT: ${OPENAI_CHAT_DAILY_LIMIT:-500}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports: ["127.0.0.1:${RADIO_PORT:-8000}:8000"]
    stop_grace_period: 15s
  api-next:
    <<: *app
    image: ${RADIO_NEXT_IMAGE:-radioworkx-api:local}
    environment: *api-env
    profiles: [deployment]
    stop_grace_period: 15s
  proxy:
    image: nginx:1.28-alpine
    profiles: [deployment]
    ports: ["127.0.0.1:${RADIO_PROXY_PORT:-8001}:8080"]
    volumes:
      - ./.deploy/nginx:/etc/nginx:ro
    restart: unless-stopped
  dispatcher:
    <<: *app
    command: ["python", "-m", "app.workers", "dispatch"]
  crawler:
    <<: *app
    command: ["python", "-m", "app.workers", "crawler"]
  reactions:
    <<: *app
    command: ["python", "-m", "app.workers", "reactions"]
  downloads:
    <<: *app
    command: ["python", "-m", "app.workers", "downloads"]
  visuals:
    <<: *app
    environment:
      <<: *env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VIDEO_MODEL: ${VIDEO_MODEL:-sora-2}
    command: ["python", "-m", "app.workers", "visuals"]
  station:
    <<: *app
    environment:
      <<: *env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      ANNOUNCER_ENABLED: ${ANNOUNCER_ENABLED:-1}
      ANNOUNCER_MODEL: ${ANNOUNCER_MODEL:-gpt-4o-mini-tts}
      ANNOUNCER_VOICE: ${ANNOUNCER_VOICE:-onyx}
      ANNOUNCER_GAIN_DB: ${ANNOUNCER_GAIN_DB:-6}
    command: ["python", "-m", "app.workers", "station"]
  telemetry-observer:
    <<: *app
    command: ["python", "-m", "app.telemetry_collector"]
    environment:
      <<: *env
      SERVICE_NAME: radioworkx-observer
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    mem_limit: 2g
    volumes: ["elastic-data:/usr/share/elasticsearch/data"]
    ports: ["127.0.0.1:9200:9200"]
    restart: unless-stopped
  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.4
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    mem_limit: 768m
    volumes:
      - telemetry-data:/telemetry:ro
      - logstash-data:/usr/share/logstash/data
      - ./infra/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./infra/elk/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on: [elasticsearch]
    restart: unless-stopped
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
      XPACK_SECURITY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1280m
    ports: ["127.0.0.1:5601:5601"]
    depends_on: [elasticsearch]
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
    mem_limit: 2g
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    ports: ["127.0.0.1:9201:9200"]
    restart: unless-stopped
  opensearch-ingest:
    build:
      context: ./infra/opensearch
      dockerfile: Dockerfile.logstash
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    mem_limit: 768m
    volumes:
      - telemetry-data:/telemetry:ro
      - opensearch-ingest-data:/usr/share/logstash/data
      - ./infra/opensearch/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./infra/elk/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on: [opensearch]
    restart: unless-stopped
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1280m
    ports: ["127.0.0.1:5602:5601"]
    depends_on: [opensearch]
    restart: unless-stopped
volumes:
  opensearch-data:
  opensearch-ingest-data:
  telemetry-data:
  elastic-data:
  logstash-data:
  localstack-data:
  radio-data:
  redis-data:
