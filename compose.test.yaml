# Disposable PostgreSQL integration-test server, independent of the live stack.
name: radioworkx-pg-test
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: radioworkx_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: radioworkx_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radioworkx_test -d radioworkx_test"]
      interval: 1s
      retries: 30
