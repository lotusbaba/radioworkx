input {
  file {
    path => ["/telemetry/*.jsonl", "/telemetry/*.jsonl.[1-4]"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/radioworkx.sincedb"
    codec => json
    ecs_compatibility => "v8"
  }
}
filter {
  if ![event][id] { drop {} }
  mutate { remove_field => ["message", "[log][file]", "host", "@version"] }
  ruby {
    code => 'event.set("[radioworkx][category]", event.get("[event][action]").to_s.split(".").first)'
  }
}
output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "radioworkx-events-%{+YYYY.MM.dd}"
    document_id => "%{[event][id]}"
    manage_template => false
    ecs_compatibility => disabled
  }
}
