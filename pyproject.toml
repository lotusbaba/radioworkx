[project]
name = "radioworkx"
version = "0.1.0"
description = "A community-powered live radio station"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "boto3>=1.36,<2", "redis>=5.2,<7", "httpx>=0.28,<1", "itsdangerous>=2.2,<3", "mutagen>=1.47,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "fakeredis[lua]>=2.28,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
